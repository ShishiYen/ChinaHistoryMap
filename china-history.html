<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中國史時間地圖</title>
  <style>
    :root {
      --paper: #f6ecd8;
      --ink: #211a12;
      --panel: rgba(255, 251, 241, .94);
      --line: rgba(52, 40, 26, .18);
      --shadow: 0 16px 38px rgba(31, 23, 12, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #17120b;
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.07), transparent 16%, transparent 84%, rgba(0,0,0,.08)),
        var(--paper);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    canvas.dragging { cursor: grabbing; }

    .toolbar {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .title {
      min-width: 190px;
      padding: 0 10px 0 3px;
      border-right: 1px solid var(--line);
      line-height: 1.2;
    }

    .title strong {
      display: block;
      font-size: 15px;
    }

    .title span {
      display: block;
      margin-top: 3px;
      color: #70634f;
      font-size: 11px;
    }

    button {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(54, 42, 28, .18);
      border-radius: 7px;
      background: #fff8e8;
      color: #2d2418;
      font: 800 15px/1 system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover { background: #fff0cc; }

    .search { position: relative; width: min(330px, 34vw); }

    .search input {
      width: 100%;
      height: 34px;
      border: 1px solid rgba(54, 42, 28, .18);
      border-radius: 7px;
      background: #fffaf0;
      padding: 0 34px 0 11px;
      color: #2d2418;
      font-size: 13px;
      outline: none;
    }

    .search::after {
      content: "⌕";
      position: absolute;
      right: 10px;
      top: 4px;
      color: #8a765d;
      font-size: 20px;
      pointer-events: none;
    }

    .range-control {
      height: 34px;
      border: 1px solid rgba(54, 42, 28, .18);
      border-radius: 7px;
      background: #fffaf0;
      padding: 0 10px;
      color: #2d2418;
      font: 700 12px "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      outline: none;
    }

    .suggestions {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      max-height: 310px;
      overflow: auto;
      display: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf0;
      box-shadow: var(--shadow);
    }

    .suggestions.visible { display: block; }

    .suggestion {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(54,42,28,.08);
      cursor: pointer;
      font-size: 13px;
    }

    .suggestion:hover { background: #fff0ce; }

    .suggestion small {
      display: block;
      margin-top: 2px;
      color: #746752;
      font-size: 11px;
    }

    .dock {
      position: absolute;
      right: 14px;
      top: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }

    .dock > * { pointer-events: auto; }

    .event-panel,
    .minimap-panel {
      width: 300px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 251, 241, .9);
      box-shadow: var(--shadow);
    }

    .event-panel { max-height: 360px; }

    .event-panel.collapsed,
    .minimap-panel.collapsed {
      position: relative;
      width: 42px;
      height: 104px;
      display: grid;
      grid-template-rows: 34px 1fr;
      place-items: center;
    }

    .event-panel.collapsed .event-list,
    .event-panel.collapsed #eventPanelTitle,
    .minimap-panel.collapsed .minimap-wrap { display: none; }

    .event-panel.collapsed::after,
    .minimap-panel.collapsed::after {
      content: "大事";
      writing-mode: vertical-rl;
      color: #5a4b36;
      font-size: 12px;
      font-weight: 800;
    }

    .minimap-panel.collapsed::after { content: "小圖"; }

    .event-head,
    .minimap-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-bottom: 1px solid rgba(54,42,28,.12);
      color: #3d3223;
      font-size: 12px;
      font-weight: 800;
    }

    .event-panel.collapsed .event-head,
    .minimap-panel.collapsed .minimap-head {
      width: 100%;
      justify-content: center;
      padding: 4px 0;
      border-bottom: 0;
    }

    .event-head button,
    .minimap-head button {
      width: 26px;
      height: 26px;
      font-size: 12px;
    }

    .event-list {
      max-height: 318px;
      overflow: auto;
      padding: 5px 0;
    }

    .event-row {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 7px;
      padding: 5px 9px;
      color: #3d3223;
      font-size: 11px;
      line-height: 1.3;
      cursor: pointer;
    }

    .event-row:hover { background: rgba(197, 146, 78, .14); }

    .event-year {
      color: #7a674f;
      font-weight: 800;
      text-align: right;
    }

    .note {
      max-width: 375px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: #4d402f;
      font-size: 12px;
      line-height: 1.45;
    }

    .minimap-panel {
      width: 138px;
      background: var(--panel);
    }

    .minimap-wrap {
      width: 138px;
      height: 220px;
      padding: 8px;
    }

    #minimap {
      position: static;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      background: #fbf0db;
      cursor: crosshair;
    }

    .tooltip {
      position: absolute;
      z-index: 10;
      min-width: 176px;
      max-width: 280px;
      display: none;
      padding: 7px 8px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 6px;
      background: rgba(28, 22, 15, .98);
      color: #fff8e9;
      box-shadow: 0 12px 26px rgba(0,0,0,.36);
      pointer-events: none;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
    }

    .tooltip span {
      color: #f0d8b1;
      font-size: 10px;
      line-height: 1.35;
    }

    .tooltip a {
      color: #fff2ad;
      text-decoration: none;
      pointer-events: auto;
    }

    .tooltip a:hover { text-decoration: underline; }

    .mobile-strip {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 9;
      display: none;
      grid-template-columns: 36px 1fr 36px;
      gap: 7px;
      align-items: center;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 251, 241, .94);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .mobile-strip span {
      overflow: hidden;
      color: #3d3223;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .toolbar {
        left: 8px;
        right: 8px;
        flex-wrap: wrap;
        gap: 6px;
        padding: 7px;
      }

      .title {
        width: auto;
        min-width: 136px;
        flex: 1 1 136px;
        border-right: 0;
      }

      .title span { display: none; }

      .search {
        flex: 1 1 100%;
        width: auto;
      }

      .range-control {
        flex: 1 1 140px;
        min-width: 132px;
      }

      .note { display: none; }
      .event-panel { max-width: calc(100vw - 16px); }

      .dock {
        right: 8px;
        top: auto;
        bottom: 8px;
      }

      .minimap-panel,
      .minimap-wrap {
        width: 96px;
      }

      .minimap-wrap {
        height: 150px;
        padding: 6px;
      }

      .mobile-strip { display: grid; }

      .tooltip { pointer-events: auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="timeline" aria-label="中國史時間地圖"></canvas>
    <div class="toolbar">
      <div class="title">
        <strong>中國史時間地圖</strong>
        <span>西元前 2100 → 2026，古代在下</span>
      </div>
      <button id="zoomIn" type="button" title="放大">+</button>
      <button id="zoomOut" type="button" title="縮小">−</button>
      <button id="fit" type="button" title="回到全圖">⌂</button>
      <button id="fullscreen" type="button" title="全螢幕">⛶</button>
      <select id="rangeSelect" class="range-control" title="切換時間範圍" aria-label="切換時間範圍"></select>
      <div class="search">
        <input id="searchInput" type="search" placeholder="搜尋朝代、人物、事件、制度" autocomplete="off">
        <div id="suggestions" class="suggestions"></div>
      </div>
    </div>
    <div class="dock">
      <div class="note">拖曳移動畫面，滾輪縮放。事件點滑過可看說明，右鍵開啟維基百科。這份獨立頁面加強《史記》、漢、唐、清、民國初年。</div>
      <div id="eventPanel" class="event-panel">
        <div class="event-head">
          <button id="eventPanelToggle" type="button" title="收合大事年表">×</button>
          <span id="eventPanelTitle">視窗大事</span>
        </div>
        <div id="eventList" class="event-list"></div>
      </div>
      <div id="minimapPanel" class="minimap-panel">
        <div class="minimap-head">
          <button id="minimapToggle" type="button" title="收合小地圖">×</button>
        </div>
        <div class="minimap-wrap"><canvas id="minimap" aria-label="中國史縮圖"></canvas></div>
      </div>
    </div>
    <div class="mobile-strip">
      <button id="mobilePrevTrack" type="button" title="上一欄">‹</button>
      <span id="mobileTrackLabel">分裂與並存</span>
      <button id="mobileNextTrack" type="button" title="下一欄">›</button>
    </div>
    <div id="tooltip" class="tooltip"></div>
  </div>

  <script>
    const ABS_YEAR_MIN = -2100;

    let YEAR_MIN = ABS_YEAR_MIN;
    let YEAR_MAX = ABS_YEAR_MAX;

    const RULER_AXIS = { x: 82, width: 94 };
    const CORE_AXIS = { x: 190, width: 168 };

      { start: -2100, end: 1800, weight: 1 },

        { start: 1912, end: 1949, weight: 10 },

    function computeLayout() {
      setResponsiveMetrics();
      let x = WORLD.left;
      const visibleTracks = tracks.filter(track => !hiddenTracks.has(track.id));
      layout = visibleTracks.map(track => {
        const width = track.width || WORLD.trackWidth;
        const box = { ...track, x, width, right: x + width };
        x += width + WORLD.gap;
        return box;
      });
      WORLD.width = WORLD.left + WORLD.right + layout.reduce((sum, track) => sum + track.width, 0) + Math.max(0, visibleTracks.length - 1) * WORLD.gap;
      WORLD.totalHeight = WORLD.top + WORLD.height + WORLD.bottom;
    }

    function setResponsiveMetrics() {
      const mobile = viewport.width > 0 && viewport.width < 760;
      WORLD.left = mobile ? 252 : 400;
      RULER_AXIS.x = mobile ? 78 : 82;
      RULER_AXIS.width = mobile ? 58 : 94;
      CORE_AXIS.x = mobile ? 146 : 190;
      CORE_AXIS.width = mobile ? 92 : 168;
    }

    function applyTimeRange(rangeId, keepCenter = false) {
      const next = timeRanges.find(range => range.id === rangeId) || timeRanges[0];
      const center = keepCenter ? yToYear(screenToWorld(0, viewport.height / 2).y) : next.focus;
      activeRange = next;
      YEAR_MIN = next.min;
      YEAR_MAX = next.max;
      TIME_SEGMENTS = (next.segments || [{ start: next.min, end: next.max, weight: next.max >= 1900 ? 7 : 1 }])
        .map(segment => ({
          start: Math.max(next.min, segment.start),
          end: Math.min(next.max, segment.end),
          weight: segment.weight
        }))
        .filter(segment => segment.end > segment.start);
      if (!TIME_SEGMENTS.length) TIME_SEGMENTS = [{ start: next.min, end: next.max, weight: 1 }];
      rangeSelect.value = next.id;
      const focus = Math.min(YEAR_MAX, Math.max(YEAR_MIN, center));
      focusWorld(WORLD.left, yearToY(focus), viewport.width < 760 ? Math.max(viewport.scale, .82) : Math.max(viewport.scale, .72));
    }

    function itemSpan(item) {
      if (typeof item.year === "number") return { start: item.year, end: item.year };
      return { start: item.start, end: item.end };
    }

    function rangeContains(span, range = activeRange) {
      return span.start >= range.min && span.end <= range.max;
    }

    function bestRangeForItem(item) {
      const span = itemSpan(item);
      return timeRanges.find(range => span.start >= range.min && span.end <= range.max) || timeRanges[0];
    }

    function ensureRangeForItem(item) {
      const span = itemSpan(item);
      if (rangeContains(span)) return;
      applyTimeRange(bestRangeForItem(item).id);
    }

    function trackInfo(id) { return layout.find(track => track.id === id); }
    function timeUnitsTotal() {
      return TIME_SEGMENTS.reduce((sum, segment) => sum + (segment.end - segment.start) * segment.weight, 0);
    }

    function unitsBeforeYear(year) {
      const clamped = Math.min(YEAR_MAX, Math.max(YEAR_MIN, year));
      let units = 0;
      for (const segment of TIME_SEGMENTS) {
        if (clamped >= segment.end) {
          units += (segment.end - segment.start) * segment.weight;
        } else if (clamped > segment.start) {
          units += (clamped - segment.start) * segment.weight;
          break;
        } else {
          break;
        }
      }
      return units;
    }

    function yearToY(year) {
      const t = 1 - unitsBeforeYear(year) / timeUnitsTotal();
      return WORLD.top + t * WORLD.height;
    }

    function yToYear(y) {
      const unitsFromBottom = (1 - ((y - WORLD.top) / WORLD.height)) * timeUnitsTotal();
      let remaining = unitsFromBottom;
      for (const segment of TIME_SEGMENTS) {
        const segmentUnits = (segment.end - segment.start) * segment.weight;
        if (remaining <= segmentUnits) {
          return Math.round(segment.start + remaining / segment.weight);
        }
        remaining -= segmentUnits;
      }
      return YEAR_MAX;
    }

    function segmentForYear(year) {
      return TIME_SEGMENTS.find(segment => year >= segment.start && year <= segment.end) || TIME_SEGMENTS[TIME_SEGMENTS.length - 1];
    }

    function yearPixels(year = yToYear(screenToWorld(0, viewport.height / 2).y)) {
      return (WORLD.height / timeUnitsTotal()) * segmentForYear(year).weight * viewport.scale;
    }

    function shouldShowEventText(item) {
      return item.important || item.year >= 1800 || viewport.scale >= .72 || yearPixels(item.year) > 1.25;
    }

    function tickSteps() {
      const px = yearPixels();
      if (px >= 12) return { major: 10, minor: 1, label: 5 };
      if (px >= 6) return { major: 25, minor: 5, label: 10 };
      if (px >= 3) return { major: 50, minor: 10, label: 25 };
      if (px >= 1.4) return { major: 100, minor: 25, label: 50 };
      return { major: 250, minor: 50, label: 100 };
    }

    function stepsForYear(year, mini = false) {
      if (mini) return { major: 100, minor: 20, label: 100 };
      if (year >= 1900) {
        const px = yearPixels(year);
        if (px >= 22) return { major: 20, minor: 1, label: 5 };
        if (px >= 10) return { major: 20, minor: 2, label: 10 };
        return { major: 20, minor: 5, label: 20 };
      }
      if (year >= 1800) {
        const px = yearPixels(year);
        if (px >= 12) return { major: 20, minor: 2, label: 10 };
        return { major: 20, minor: 5, label: 20 };
      }
      const px = yearPixels(year);
      if (px >= 12) return { major: 25, minor: 5, label: 10 };
      if (px >= 6) return { major: 50, minor: 10, label: 25 };
      if (px >= 3) return { major: 100, minor: 25, label: 50 };
      if (px >= 1.4) return { major: 250, minor: 50, label: 100 };
      return { major: 500, minor: 100, label: 500 };
    }
    function alignedStart(step) { return Math.ceil(YEAR_MIN / step) * step; }
    function screenToWorld(x, y) { return { x: (x - viewport.tx) / viewport.scale, y: (y - viewport.ty) / viewport.scale }; }

    function laneBox(item) {
      const track = trackInfo(item.track);
      if (!track) return null;
      const lanes = laneCountForTrack(track.id);
      const gap = 5;
      const laneWidth = (track.width - gap * (lanes + 1)) / lanes;
      const lane = Math.min(item.lane || 0, lanes - 1);
      return { x: track.x + gap + lane * (laneWidth + gap), width: laneWidth, track, lane };
    }

    function laneCountForTrack(trackId) {
      return {
        parallel: 20,
        institutions: 3,
        global: 2,
        frontier: 2,
        taiwan: 3,
        thought: 2,
        wars: 2
      }[trackId] || 2;
    }

    function formatYear(year) {
      const value = Math.round(year);
      return value < 0 ? `西元前 ${Math.abs(value)}` : `西元 ${value}`;
    }
    function hexToRgba(hex, alpha) {
      const value = hex.replace("#", "");
      return `rgba(${parseInt(value.slice(0,2),16)}, ${parseInt(value.slice(2,4),16)}, ${parseInt(value.slice(4,6),16)}, ${alpha})`;
    }
    function readableText(hex) {
      const value = hex.replace("#", "");
      const r = parseInt(value.slice(0,2),16), g = parseInt(value.slice(2,4),16), b = parseInt(value.slice(4,6),16);
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > .58 ? "#211a12" : "#fff8eb";
    }

    function roundRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.lineTo(x + width - r, y);
      context.quadraticCurveTo(x + width, y, x + width, y + r);
      context.lineTo(x + width, y + height - r);
      context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      context.lineTo(x + r, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - r);
      context.lineTo(x, y + r);
      context.quadraticCurveTo(x, y, x + r, y);
      context.closePath();
    }

    function draw() {
      ctx.setTransform(viewport.dpr, 0, 0, viewport.dpr, 0, 0);
      ctx.clearRect(0, 0, viewport.width, viewport.height);
      fixedHits = [];
      ctx.save();
      ctx.translate(viewport.tx, viewport.ty);
      ctx.scale(viewport.scale, viewport.scale);
      drawWorld(ctx, false);
      ctx.restore();
      drawRulerAxis();
      drawCoreAxis();
      drawFixedAxes();
      drawMinimap();
      updateEventPanel();
    }

    function drawWorld(context, mini) {
      if (!mini) hits = [];
      context.fillStyle = "#f6ecd8";
      context.fillRect(0, 0, WORLD.width, WORLD.totalHeight);
      drawGrid(context, mini);
      drawTracks(context, mini);
      drawPeriods(context, mini);
      drawEvents(context, mini);
      if (!mini) {
        context.fillStyle = "#2d2418";
        context.font = "800 38px 'Microsoft JhengHei', sans-serif";
        context.fillText("CHINA HISTORY", WORLD.left, 55);
        context.font = "600 17px 'Microsoft JhengHei', sans-serif";
        context.fillStyle = "#6f604b";
        context.fillText("朝代、制度、史學、戰爭與近現代變局", WORLD.left, 78);
      }
    }

    function drawGrid(context, mini) {
      context.textAlign = "right";
      context.textBaseline = "middle";
      for (const segment of TIME_SEGMENTS) {
        const probeYear = Math.max(segment.start, Math.min(segment.end - 1, segment.start + 1));
        const steps = stepsForYear(probeYear, mini);
        for (let year = alignedStart(steps.minor); year <= segment.end; year += steps.minor) {
          if (year < segment.start || year > YEAR_MAX) continue;
          const y = yearToY(year);
          const major = year % steps.major === 0;
          context.strokeStyle = major ? "rgba(61, 48, 31, .28)" : "rgba(61, 48, 31, .09)";
          context.lineWidth = major ? 1.2 : .7;
          context.beginPath();
          context.moveTo(WORLD.left - 12, y);
          context.lineTo(WORLD.width - WORLD.right + 12, y);
          context.stroke();
          // Year labels are drawn by drawFixedAxes in screen space; drawing them
          // here would scale the text and cause overlap at high zoom.
        }
      }
    }

    function drawTracks(context, mini) {
      layout.forEach(track => {
        context.fillStyle = hexToRgba(track.color, mini ? .11 : .075);
        context.fillRect(track.x, WORLD.top, track.width, WORLD.height);
        context.strokeStyle = "rgba(42, 32, 20, .24)";
        context.lineWidth = 1.4;
        context.strokeRect(track.x, WORLD.top, track.width, WORLD.height);
        if (!mini) {
          context.fillStyle = "#2d2418";
          context.font = "800 17px 'Microsoft JhengHei', sans-serif";
          context.textAlign = "center";
          context.textBaseline = "bottom";
          context.fillText(track.name, track.x + track.width / 2, WORLD.top - 12);
        }
      });
    }

    function drawPeriods(context, mini) {
      periods.forEach(item => {
        if (item.end < YEAR_MIN || item.start > YEAR_MAX) return;
        if (hiddenTracks.has(item.track)) return;
        const box = laneBox(item);
        if (!box) return;
        const y1 = yearToY(item.end);
        const y2 = yearToY(item.start);
        const h = Math.max(5, y2 - y1);
        context.fillStyle = hexToRgba(box.track.color, mini ? .72 : .84);
        roundRect(context, box.x, y1, box.width, h, mini ? 1 : 4);
        context.fill();
        context.strokeStyle = "rgba(35, 27, 18, .45)";
        context.lineWidth = 1.1;
        context.stroke();
        if (!mini) {
          drawLabel(context, item.name, box, y1, h, box.track.color);
          hits.push({ type: "period", item, x: box.x, y: y1, w: box.width, h });
        }
      });
    }

    function drawLabel(context, text, box, y, h, color) {
      if (h < 8 || box.width < 10) return;
      context.save();
      context.beginPath();
      context.rect(box.x + 2, y + 2, box.width - 4, h - 4);
      context.clip();
      context.fillStyle = readableText(color);
      context.textAlign = "center";
      context.textBaseline = "middle";
      const size = Math.max(9, Math.min(18, Math.min(box.width / Math.max(2, text.length * .78), h / 2.2)));
      context.font = `800 ${size}px 'Microsoft JhengHei', sans-serif`;
      if (context.measureText(text).width <= box.width - 8 && h >= size + 8) {
        context.fillText(text, box.x + box.width / 2, y + h / 2);
      } else {
        const vSize = Math.max(8, Math.min(15, Math.min(box.width - 6, h / Math.max(2, text.length) * .95)));
        drawVerticalText(context, text.length > 5 ? text.slice(0, 5) : text, box.x + box.width / 2, y + h / 2, vSize);
      }
      if (h > 78 && box.width > 58) {
        context.font = "600 9px 'Microsoft JhengHei', sans-serif";
        context.globalAlpha = .76;
        const item = periods.find(period => period.name === text);
        if (item) context.fillText(`${formatYear(item.start)} - ${formatYear(item.end)}`, box.x + box.width / 2, y + h - 10);
      }
      context.restore();
    }

    function drawVerticalText(context, text, x, y, size) {
      const chars = [...text];
      const step = size * .9;
      context.font = `800 ${size}px 'Microsoft JhengHei', sans-serif`;
      chars.forEach((char, i) => context.fillText(char, x, y - ((chars.length - 1) * step) / 2 + i * step));
    }

    function drawEvents(context, mini) {
      const drawItems = [];
      events.forEach(item => {
        if (item.core) return;
        if (item.year < YEAR_MIN || item.year > YEAR_MAX) return;
        if (hiddenTracks.has(item.track)) return;
        const box = laneBox(item);
        if (!box) return;
        const x = box.x + box.width / 2;
        const y = yearToY(item.year);
        drawItems.push({ item, box, x, y });
      });
      const clusterData = mini ? { byId: new Map(), clusters: [] } : buildEventLabelClusters(drawItems);
      drawItems.forEach(({ item, box, x, y }) => {
        if (!mini && clusterData.byId.has(item.id)) return;
        const r = mini ? 1.8 : 5.4;
        context.fillStyle = "#fff2ad";
        context.strokeStyle = "#332719";
        context.lineWidth = mini ? .7 : 1.4;
        context.beginPath();
        context.arc(x, y, r, 0, Math.PI * 2);
        context.fill();
        context.stroke();
        if (!mini) hits.push({ type: "event", item, x: x - 9, y: y - 9, w: 18, h: 18 });
        if (!mini) drawEventLabel(context, item, x, y, box);
      });
      if (!mini) clusterData.clusters.forEach(cluster => drawEventCluster(context, cluster));
    }

    function buildEventLabelClusters(drawItems) {
      const groups = new Map();
      drawItems.forEach(entry => {
        if (!shouldShowEventText(entry.item)) return;
        const key = `${entry.item.track}:${entry.box.lane}:${Math.round(entry.y / 18)}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(entry);
      });
      const byId = new Map();
      const clusters = [];
      groups.forEach(group => {
        if (group.length < 2) return;
        group.sort((a, b) => b.item.year - a.item.year || a.item.name.localeCompare(b.item.name));
        const x = group.reduce((sum, entry) => sum + entry.x, 0) / group.length;
        const y = group.reduce((sum, entry) => sum + entry.y, 0) / group.length;
        const box = group[0].box;
        const cluster = { id: `cluster-${clusters.length}`, entries: group, box, x, y };
        clusters.push(cluster);
        group.forEach(entry => byId.set(entry.item.id, cluster));
      });
      return { byId, clusters };
    }

    function drawEventLabel(context, item, x, y, box) {
      const density = yearPixels(item.year);
      if (!shouldShowEventText(item)) return;
      const label = item.name.length > 12 ? `${item.name.slice(0, 11)}…` : item.name;
      context.save();
      context.font = density > 7 ? "600 11px 'Microsoft JhengHei', sans-serif" : "600 9px 'Microsoft JhengHei', sans-serif";
      context.fillStyle = "rgba(61, 54, 43, .72)";
      context.textAlign = "left";
      context.textBaseline = "middle";
      const tx = Math.min(box.track.right - 4, x + 8);
      context.fillText(label, tx, y);
      context.restore();
    }

    function drawEventCluster(context, cluster) {
      const { entries, box, x, y } = cluster;
      const density = yearPixels(entries[0].item.year);
      const names = entries.map(entry => entry.item.name);
      const summaryNames = names.slice(0, 2).join("、");
      const label = `+${entries.length}: ${summaryNames}${names.length > 2 ? "…" : ""}`;
      const tx = Math.min(box.track.right - 4, x + 10);
      const maxWidth = Math.max(36, box.track.right - tx - 4);
      const text = fitText(context, label, maxWidth);
      context.save();
      context.fillStyle = "#fff2ad";
      context.strokeStyle = "#332719";
      context.lineWidth = 1.5;
      context.beginPath();
      context.arc(x, y, 6.5, 0, Math.PI * 2);
      context.fill();
      context.stroke();
      context.font = density > 7 ? "700 11px 'Microsoft JhengHei', sans-serif" : "700 9px 'Microsoft JhengHei', sans-serif";
      context.fillStyle = "rgba(46, 41, 34, .82)";
      context.textAlign = "left";
      context.textBaseline = "middle";
      context.fillText(text, tx, y);
      const textWidth = context.measureText(text).width;
      context.restore();
      hits.push({ type: "eventCluster", item: entries[0].item, items: entries.map(entry => entry.item), x: x - 10, y: y - 11, w: Math.max(22, tx - x + textWidth + 8), h: 22 });
    }

    function fitText(context, text, maxWidth) {
      if (context.measureText(text).width <= maxWidth) return text;
      let next = text;
      while (next.length > 4 && context.measureText(`${next}…`).width > maxWidth) next = next.slice(0, -1);
      return `${next}…`;
    }

    function drawRulerAxis() {
      const x = RULER_AXIS.x;
      const width = RULER_AXIS.width;
      ctx.save();
      ctx.setTransform(viewport.dpr, 0, 0, viewport.dpr, 0, 0);
      ctx.fillStyle = "rgba(255, 250, 238, .93)";
      roundRect(ctx, x - 8, 78, width + 16, viewport.height - 128, 8);
      ctx.fill();
      ctx.strokeStyle = "rgba(54,42,28,.18)";
      ctx.stroke();

      ctx.fillStyle = "#2d2418";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "800 13px 'Microsoft JhengHei', sans-serif";
      ctx.fillText(viewport.width < 760 ? "首腦" : "代表首腦", x + width / 2, 92);

      const visible = rulers
        .filter(item => item.end >= YEAR_MIN && item.start <= YEAR_MAX)
        .map(item => ({
          item,
          y1: yearToY(item.end) * viewport.scale + viewport.ty,
          y2: yearToY(item.start) * viewport.scale + viewport.ty
        }))
        .filter(entry => entry.y2 >= 78 && entry.y1 <= viewport.height - 40);
      const dense = buildRulerClusters(visible);
      visible.forEach(entry => {
        if (dense.byId.has(entry.item.id)) return;
        drawRulerBlock(entry.item, x, width, entry.y1, entry.y2);
      });
      dense.clusters.forEach(cluster => drawRulerCluster(cluster, x, width));
      ctx.restore();
    }

    function drawRulerBlock(item, x, width, y1, y2) {
      const yy = Math.max(104, y1);
      const hh = Math.min(viewport.height - 40, y2) - yy;
      if (hh < 3) return;
      const color = colorForPolity(item.polity);
      ctx.fillStyle = hexToRgba(color, item.uncertain ? .58 : .86);
      roundRect(ctx, x, yy, width, hh, 4);
      ctx.fill();
      ctx.strokeStyle = "rgba(35,27,18,.38)";
      ctx.stroke();
      if (hh > 12) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(x + 2, yy + 2, width - 4, hh - 4);
        ctx.clip();
        ctx.fillStyle = readableText(color);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const label = item.uncertain ? `${item.name}?` : item.name;
        const size = Math.max(8, Math.min(13, Math.min(width / Math.max(2, label.length * .8), hh / 2.2)));
        ctx.font = `800 ${size}px 'Microsoft JhengHei', sans-serif`;
        if (ctx.measureText(label).width <= width - 8 && hh >= size + 8) {
          ctx.fillText(label, x + width / 2, yy + hh / 2);
        } else {
          drawVerticalText(ctx, label.slice(0, 4), x + width / 2, yy + hh / 2, Math.min(12, Math.max(8, width - 8)));
        }
        if (hh > 42) {
          ctx.globalAlpha = .82;
          ctx.font = "600 8px 'Microsoft JhengHei', sans-serif";
          ctx.fillText(item.title, x + width / 2, yy + hh - 9);
        }
        ctx.restore();
      }
      fixedHits.push({ type: "ruler", item, x, y: yy, w: width, h: hh });
    }

    function buildRulerClusters(entries) {
      const byId = new Map();
      const clusters = [];
      const sorted = entries
        .filter(entry => Math.min(viewport.height - 40, entry.y2) - Math.max(104, entry.y1) < 12)
        .sort((a, b) => a.y1 - b.y1);
      let group = [];
      sorted.forEach(entry => {
        if (!group.length || Math.abs(entry.y1 - group[group.length - 1].y1) < 18) {
          group.push(entry);
        } else {
          pushRulerGroup(group, clusters, byId);
          group = [entry];
        }
      });
      pushRulerGroup(group, clusters, byId);
      return { byId, clusters };
    }

    function pushRulerGroup(group, clusters, byId) {
      if (group.length < 2) return;
      const y = group.reduce((sum, entry) => sum + (entry.y1 + entry.y2) / 2, 0) / group.length;
      const cluster = { entries: group, y };
      clusters.push(cluster);
      group.forEach(entry => byId.set(entry.item.id, cluster));
    }

    function drawRulerCluster(cluster, x, width) {
      const items = cluster.entries.map(entry => entry.item).sort((a, b) => b.start - a.start);
      const names = items.map(item => item.name);
      const label = `+${items.length}: ${names.slice(0, 2).join("、")}${names.length > 2 ? "…" : ""}`;
      const y = Math.max(108, Math.min(viewport.height - 44, cluster.y));
      ctx.fillStyle = "rgba(255,242,173,.96)";
      ctx.strokeStyle = "#34291b";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(x + width - 10, y, 5.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(46, 41, 34, .84)";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.font = "700 9px 'Microsoft JhengHei', sans-serif";
      const text = fitText(ctx, label, width - 14);
      ctx.fillText(text, x + width - 18, y);
      fixedHits.push({ type: "rulerCluster", item: items[0], items, x, y: y - 11, w: width, h: 22 });
    }

    function colorForPolity(polity) {
      const match = coreAxis.find(item => polity.includes(item.name) || item.name.includes(polity));
      if (match) return match.color;
      if (polity.includes("民國") || polity.includes("北洋") || polity.includes("南京")) return "#d8793c";
      if (polity.includes("中華人民共和國")) return "#c94f3b";
      if (polity.includes("周")) return "#c28a43";
      return "#bf7650";
    }

    function drawCoreAxis() {
      const x = CORE_AXIS.x;
      const width = CORE_AXIS.width;
      ctx.save();
      ctx.setTransform(viewport.dpr, 0, 0, viewport.dpr, 0, 0);
      ctx.fillStyle = "rgba(255, 250, 238, .92)";
      roundRect(ctx, x - 10, 78, width + 20, viewport.height - 128, 8);
      ctx.fill();
      ctx.strokeStyle = "rgba(54,42,28,.18)";
      ctx.stroke();

      ctx.fillStyle = "#2d2418";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "800 13px 'Microsoft JhengHei', sans-serif";
      ctx.fillText("中原主軸", x + width / 2, 92);

      coreAxis.forEach(item => {
        if (item.end < YEAR_MIN || item.start > YEAR_MAX) return;
        const y1 = yearToY(item.end) * viewport.scale + viewport.ty;
        const y2 = yearToY(item.start) * viewport.scale + viewport.ty;
        const h = Math.max(4, y2 - y1);
        if (y2 < 78 || y1 > viewport.height - 40) return;
        const yy = Math.max(104, y1);
        const hh = Math.min(viewport.height - 40, y2) - yy;
        if (hh < 3) return;
        ctx.fillStyle = hexToRgba(item.color, .92);
        roundRect(ctx, x, yy, width, hh, 4);
        ctx.fill();
        ctx.strokeStyle = "rgba(35,27,18,.45)";
        ctx.stroke();
        ctx.fillStyle = readableText(item.color);
        ctx.font = `800 ${Math.max(10, Math.min(18, hh / 3.2))}px 'Microsoft JhengHei', sans-serif`;
        if (hh > 20) {
          ctx.fillText(item.name, x + width / 2, yy + hh / 2);
        }
        if (hh > 46 && item.note) {
          ctx.font = "600 9px 'Microsoft JhengHei', sans-serif";
          ctx.globalAlpha = .82;
          ctx.fillText(item.note.slice(0, 16), x + width / 2, yy + hh - 12);
          ctx.globalAlpha = 1;
        }
        fixedHits.push({ type: "core", item, x, y: yy, w: width, h: hh });
      });

      const coreEventEntries = events
        .filter(item => item.core)
        .filter(item => item.year >= YEAR_MIN && item.year <= YEAR_MAX)
        .map(item => ({ item, y: yearToY(item.year) * viewport.scale + viewport.ty }))
        .filter(entry => entry.y >= 78 && entry.y <= viewport.height - 40);
      const coreClusters = buildCoreEventClusters(coreEventEntries);
      coreEventEntries.forEach(({ item, y }) => {
        if (coreClusters.byId.has(item.id)) return;
        if (y < 78 || y > viewport.height - 40) return;
        const cx = x + width - 14;
        ctx.fillStyle = "#fff2ad";
        ctx.strokeStyle = "#34291b";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(cx, y, 4.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.font = item.year >= 1900 ? "600 11px 'Microsoft JhengHei', sans-serif" : "600 9px 'Microsoft JhengHei', sans-serif";
        ctx.fillStyle = "rgba(61, 54, 43, .72)";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText(item.name.length > 10 ? `${item.name.slice(0, 9)}…` : item.name, cx - 8, y);
        fixedHits.push({ type: "event", item, x: cx - 9, y: y - 9, w: 18, h: 18 });
      });
      coreClusters.clusters.forEach(cluster => drawCoreEventCluster(cluster, x, width));
      ctx.restore();
    }

    function buildCoreEventClusters(entries) {
      const groups = new Map();
      entries.forEach(entry => {
        if (!shouldShowEventText(entry.item)) return;
        const key = Math.round(entry.y / 18);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(entry);
      });
      const byId = new Map();
      const clusters = [];
      groups.forEach(group => {
        if (group.length < 2) return;
        group.sort((a, b) => b.item.year - a.item.year || a.item.name.localeCompare(b.item.name));
        const y = group.reduce((sum, entry) => sum + entry.y, 0) / group.length;
        const cluster = { entries: group, y };
        clusters.push(cluster);
        group.forEach(entry => byId.set(entry.item.id, cluster));
      });
      return { byId, clusters };
    }

    function drawCoreEventCluster(cluster, x, width) {
      const cx = x + width - 14;
      const y = cluster.y;
      const items = cluster.entries.map(entry => entry.item);
      const names = items.map(item => item.name);
      const summaryNames = names.slice(0, 2).join("、");
      ctx.fillStyle = "#fff2ad";
      ctx.strokeStyle = "#34291b";
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(cx, y, 6.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.font = items[0].year >= 1900 ? "700 10px 'Microsoft JhengHei', sans-serif" : "700 9px 'Microsoft JhengHei', sans-serif";
      ctx.fillStyle = "rgba(46, 41, 34, .82)";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      const label = `+${items.length}: ${summaryNames}${names.length > 2 ? "…" : ""}`;
      const text = fitText(ctx, label, width - 28);
      ctx.fillText(text, cx - 8, y);
      const textWidth = ctx.measureText(text).width;
      fixedHits.push({ type: "eventCluster", item: items[0], items, x: cx - 10 - textWidth - 8, y: y - 11, w: textWidth + 28, h: 22 });
    }

    function visibleYearRange() {
      const topYear = yToYear(screenToWorld(0, 0).y);
      const bottomYear = yToYear(screenToWorld(0, viewport.height).y);
      return {
        min: Math.max(YEAR_MIN, Math.min(topYear, bottomYear)),
        max: Math.min(YEAR_MAX, Math.max(topYear, bottomYear))
      };
    }

    function allEvents() {
      return events.map(item => ({
        ...item,
        trackName: item.core ? "中原主軸" : (trackById.get(item.track)?.name || "")
      }));
    }

    function updateEventPanel() {
      if (eventPanel.classList.contains("collapsed")) return;
      const range = visibleYearRange();
      const rows = allEvents()
        .filter(item => item.year >= range.min && item.year <= range.max)
        .sort((a, b) => b.year - a.year)
        .slice(0, 80);
      eventPanelTitle.textContent = `${formatYear(range.min)} - ${formatYear(range.max)} 大事`;
      eventList.innerHTML = rows.length
        ? rows.map(item => `<div class="event-row" data-id="${item.id}"><span class="event-year">${item.year < 0 ? `前${Math.abs(item.year)}` : item.year}</span><span>${item.name}<br><small>${item.trackName}</small></span></div>`).join("")
        : `<div class="event-row"><span></span><span>目前視窗沒有事件</span></div>`;
      eventList.querySelectorAll("[data-id]").forEach(row => {
        row.addEventListener("click", () => {
          const item = events.find(event => event.id === row.dataset.id);
          if (!item) return;
          const y = yearToY(item.year);
          if (item.core) {
            focusWorld(WORLD.left, y, Math.max(viewport.scale, .95));
            return;
          }
          if (hiddenTracks.has(item.track)) {
            hiddenTracks.delete(item.track);
            computeLayout();
          }
          const box = laneBox(item);
          if (box) focusWorld(box.x + box.width / 2, y, Math.max(viewport.scale, .95));
        });
      });
    }

    function drawFixedAxes() {
      const axisY = viewport.height - 34;
      axisHits = [];
      ctx.save();
      ctx.setTransform(viewport.dpr, 0, 0, viewport.dpr, 0, 0);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "800 12px 'Microsoft JhengHei', sans-serif";
      layout.forEach(track => {
        const left = track.x * viewport.scale + viewport.tx;
        const right = track.right * viewport.scale + viewport.tx;
        if (right < 0 || left > viewport.width) return;
        const x = Math.max(0, left);
        const w = Math.min(viewport.width, right) - x;
        if (w < 30) return;
        ctx.fillStyle = hexToRgba(track.color, .86);
        roundRect(ctx, x + 2, axisY, Math.max(8, w - 4), 24, 4);
        ctx.fill();
        ctx.fillStyle = readableText(track.color);
        const buttonSize = 18;
        const buttonX = x + w - buttonSize - 5;
        const labelWidth = Math.max(20, w - buttonSize - 12);
        ctx.save();
        ctx.beginPath();
        ctx.rect(x + 4, axisY + 2, labelWidth - 4, 20);
        ctx.clip();
        ctx.fillText(track.name, x + labelWidth / 2, axisY + 12);
        ctx.restore();
        ctx.fillStyle = "rgba(255,250,238,.9)";
        roundRect(ctx, buttonX, axisY + 3, buttonSize, buttonSize, 4);
        ctx.fill();
        ctx.fillStyle = "#34291b";
        ctx.font = "800 13px 'Microsoft JhengHei', sans-serif";
        ctx.fillText("×", buttonX + buttonSize / 2, axisY + 12);
        ctx.font = "800 12px 'Microsoft JhengHei', sans-serif";
        axisHits.push({ trackId: track.id, x: buttonX, y: axisY + 3, w: buttonSize, h: buttonSize });
      });

      if (hiddenTracks.size > 0) {
        let chipX = 14;
        const chipY = axisY - 31;
        ctx.textAlign = "left";
        ctx.font = "700 11px 'Microsoft JhengHei', sans-serif";
        ctx.fillStyle = "rgba(31,26,18,.88)";
        ctx.fillText("已隱藏", chipX, chipY + 12);
        chipX += 50;
        tracks.filter(track => hiddenTracks.has(track.id)).forEach(track => {
          const text = `+ ${track.name}`;
          const width = Math.min(132, Math.max(58, ctx.measureText(text).width + 16));
          if (chipX + width > viewport.width - 12) return;
          ctx.fillStyle = "rgba(255,250,238,.92)";
          roundRect(ctx, chipX, chipY, width, 22, 5);
          ctx.fill();
          ctx.strokeStyle = "rgba(54,42,28,.18)";
          ctx.stroke();
          ctx.fillStyle = "#3d3223";
          ctx.fillText(text, chipX + 8, chipY + 12);
          axisHits.push({ trackId: track.id, x: chipX, y: chipY, w: width, h: 22 });
          chipX += width + 6;
        });
      }

      ctx.textAlign = "right";
      const drawnYearLabels = new Set();
      for (const segment of TIME_SEGMENTS) {
        const steps = stepsForYear(segment.start + 1);
        ctx.font = steps.label <= 25 ? "700 10px 'Microsoft JhengHei', sans-serif" : "700 12px 'Microsoft JhengHei', sans-serif";
        for (let year = alignedStart(steps.label); year <= segment.end; year += steps.label) {
          if (year < segment.start || year > YEAR_MAX) continue;
          const labelKey = Math.round(year);
          if (drawnYearLabels.has(labelKey)) continue;
          drawnYearLabels.add(labelKey);
          const y = yearToY(year) * viewport.scale + viewport.ty;
          if (y < 0 || y > viewport.height) continue;
          ctx.strokeStyle = "rgba(26, 22, 16, .28)";
          ctx.beginPath();
          ctx.moveTo(84, y);
          ctx.lineTo(viewport.width, y);
          ctx.stroke();
          ctx.fillStyle = "rgba(255,250,238,.9)";
          roundRect(ctx, 14, y - 11, 62, 22, 4);
          ctx.fill();
          ctx.fillStyle = "#463827";
          ctx.fillText(year < 0 ? `前${Math.abs(year)}` : `${year}`, 69, y);
        }
      }

      const centerYear = yToYear(screenToWorld(0, viewport.height / 2).y);
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(31,26,18,.9)";
      roundRect(ctx, 14, viewport.height - 86, 126, 28, 5);
      ctx.fill();
      ctx.fillStyle = "#fff7e8";
      ctx.font = "700 12px 'Microsoft JhengHei', sans-serif";
      ctx.fillText(`視窗中心：${formatYear(centerYear)}`, 24, viewport.height - 72);
      ctx.restore();
    }

    function drawMinimap() {
      const rect = minimap.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return;
      const dpr = window.devicePixelRatio || 1;
      if (minimap.width !== Math.floor(rect.width * dpr) || minimap.height !== Math.floor(rect.height * dpr)) {
        minimap.width = Math.floor(rect.width * dpr);
        minimap.height = Math.floor(rect.height * dpr);
      }
      mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mctx.clearRect(0, 0, rect.width, rect.height);
      const scale = Math.min(rect.width / WORLD.width, rect.height / WORLD.totalHeight);
      const ox = (rect.width - WORLD.width * scale) / 2;
      const oy = (rect.height - WORLD.totalHeight * scale) / 2;
      mctx.save();
      mctx.translate(ox, oy);
      mctx.scale(scale, scale);
      drawWorld(mctx, true);
      mctx.restore();
      const wx = -viewport.tx / viewport.scale;
      const wy = -viewport.ty / viewport.scale;
      const ww = viewport.width / viewport.scale;
      const wh = viewport.height / viewport.scale;
      mctx.fillStyle = "rgba(255,255,255,.22)";
      mctx.strokeStyle = "#111";
      mctx.lineWidth = 2;
      mctx.fillRect(ox + wx * scale, oy + wy * scale, ww * scale, wh * scale);
      mctx.strokeRect(ox + wx * scale, oy + wy * scale, ww * scale, wh * scale);
      minimap._map = { scale, ox, oy };
    }

    function clampViewport() {
      const leftPad = 80;
      const rightPad = Math.max(80, rightOverlayWidth() + 42);
      viewport.tx = Math.min(leftPad, Math.max(viewport.width - WORLD.width * viewport.scale - rightPad, viewport.tx));
      viewport.ty = Math.min(80, Math.max(viewport.height - WORLD.totalHeight * viewport.scale - 80, viewport.ty));
    }

    function rightOverlayWidth() {
      if (viewport.width < 760) return 96;
      const widths = [eventPanel, minimapPanel]
        .filter(panel => panel && !panel.classList.contains("collapsed"))
        .map(panel => panel.getBoundingClientRect().width || 0);
      return widths.length ? Math.max(...widths) : 0;
    }

    function fitAll() {
      const sx = viewport.width / WORLD.width;
      const sy = viewport.height / WORLD.totalHeight;
      viewport.scale = Math.min(sx, sy) * .94;
      viewport.minScale = viewport.scale * .72;
      viewport.tx = (viewport.width - WORLD.width * viewport.scale) / 2;
      viewport.ty = (viewport.height - WORLD.totalHeight * viewport.scale) / 2;
      draw();
    }

    function initialView() {
      if (viewport.width < 760) {
        viewport.scale = Math.max(.78, Math.min(1.08, viewport.height / 920));
        viewport.minScale = .36;
        focusMobileTrack(0, activeRange.focus, false);
        draw();
        return;
      }
      const fitWidth = (viewport.width / WORLD.width) * .92;
      viewport.scale = Math.min(.62, Math.max(.43, fitWidth));
      viewport.minScale = Math.min(viewport.scale * .5, (viewport.height / WORLD.totalHeight) * .72);
      viewport.tx = (viewport.width - WORLD.width * viewport.scale) / 2;
      viewport.ty = viewport.height / 2 - yearToY(1919) * viewport.scale;
      clampViewport();
      draw();
    }

    function zoomAt(cx, cy, factor) {
      const before = screenToWorld(cx, cy);
      viewport.scale = Math.min(viewport.maxScale, Math.max(viewport.minScale, viewport.scale * factor));
      viewport.tx = cx - before.x * viewport.scale;
      viewport.ty = cy - before.y * viewport.scale;
      clampViewport();
      draw();
    }

    function focusWorld(x, y, scale = Math.max(viewport.scale, .85)) {
      viewport.scale = Math.min(viewport.maxScale, Math.max(viewport.minScale, scale));
      viewport.tx = viewport.width / 2 - x * viewport.scale;
      viewport.ty = viewport.height / 2 - y * viewport.scale;
      clampViewport();
      draw();
    }

    function focusMobileTrack(index = mobileTrackIndex, year = yToYear(screenToWorld(0, viewport.height / 2).y), shouldDraw = true) {
      const visible = layout.length ? layout : tracks.filter(track => !hiddenTracks.has(track.id));
      if (!visible.length) return;
      mobileTrackIndex = (index + visible.length) % visible.length;
      const track = visible[mobileTrackIndex];
      mobileTrackLabel.textContent = track.name;
      viewport.tx = viewport.width / 2 - (track.x + track.width / 2) * viewport.scale;
      viewport.ty = viewport.height / 2 - yearToY(Math.min(YEAR_MAX, Math.max(YEAR_MIN, year))) * viewport.scale;
      clampViewport();
      if (shouldDraw) draw();
    }

    function updateMobileTrackLabel() {
      if (!layout.length) return;
      mobileTrackIndex = Math.min(mobileTrackIndex, layout.length - 1);
      mobileTrackLabel.textContent = layout[mobileTrackIndex]?.name || "";
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      viewport.dpr = window.devicePixelRatio || 1;
      viewport.width = rect.width;
      viewport.height = rect.height;
      canvas.width = Math.floor(rect.width * viewport.dpr);
      canvas.height = Math.floor(rect.height * viewport.dpr);
      computeLayout();
      applyResponsivePanelDefaults();
      if (!resize.didFit) {
        initialView();
        resize.didFit = true;
      } else {
        clampViewport();
        draw();
      }
    }

    function applyResponsivePanelDefaults() {
      if (viewport.width < 760 && !applyResponsivePanelDefaults.didMobile) {
        eventPanel.classList.add("collapsed");
        eventPanelToggle.textContent = "大";
        eventPanelToggle.title = "展開大事年表";
        minimapPanel.classList.add("collapsed");
        minimapToggle.textContent = "圖";
        minimapToggle.title = "展開小地圖";
        applyResponsivePanelDefaults.didMobile = true;
      }
    }

    function pointerPosition(event, target = canvas) {
      const rect = target.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function hitAt(world) {
      return [...hits].reverse().find(hit => world.x >= hit.x && world.x <= hit.x + hit.w && world.y >= hit.y && world.y <= hit.y + hit.h);
    }

    function fixedHitAt(point) {
      return [...fixedHits].reverse().find(hit => point.x >= hit.x && point.x <= hit.x + hit.w && point.y >= hit.y && point.y <= hit.y + hit.h);
    }

    function axisHitAt(point) {
      return [...axisHits].reverse().find(hit => point.x >= hit.x && point.x <= hit.x + hit.w && point.y >= hit.y && point.y <= hit.y + hit.h);
    }

    function toggleTrack(trackId) {
      if (hiddenTracks.has(trackId)) {
        hiddenTracks.delete(trackId);
      } else {
        if (tracks.length - hiddenTracks.size <= 1) return;
        hiddenTracks.add(trackId);
      }
      computeLayout();
      updateMobileTrackLabel();
      hovered = null;
      tooltip.style.display = "none";
      clampViewport();
      draw();
    }

    function showTooltip(event, hit) {
      if (!hit) {
        tooltip.style.display = "none";
        return;
      }
      if (hit.type === "eventCluster") {
        const track = trackById.get(hit.item.track);
        const rows = hit.items
          .sort((a, b) => b.year - a.year || a.name.localeCompare(b.name))
          .map(item => `${formatYear(item.year)}　<a href="${item.wiki}" target="_blank" rel="noopener">${item.name}</a>${item.note ? `：${item.note}` : ""}`)
          .join("<br>");
        tooltip.innerHTML = `<strong>${hit.items.length} 件大事</strong><span>${track?.name || ""}<br>${rows}</span>`;
        tooltip.style.display = "block";
        positionTooltip(event);
        return;
      }
      if (hit.type === "rulerCluster") {
        const rows = hit.items
          .sort((a, b) => b.start - a.start)
          .map(item => `${formatYear(item.start)} - ${formatYear(item.end)}　<a href="${item.wiki}" target="_blank" rel="noopener">${item.name}</a>（${item.polity}）${item.note ? `：${item.note}` : ""}`)
          .join("<br>");
        tooltip.innerHTML = `<strong>${hit.items.length} 位君主/首腦</strong><span>${rows}</span>`;
        tooltip.style.display = "block";
        positionTooltip(event);
        return;
      }
      const item = hit.item;
      const track = hit.type === "ruler" ? { name: `${item.polity} · ${item.title}` } : (item.core || hit.type === "core" ? { name: "中原主軸" } : trackById.get(item.track));
      const time = hit.type === "event" ? formatYear(item.year) : `${formatYear(item.start)} - ${formatYear(item.end)}`;
      tooltip.innerHTML = `<strong>${item.name}</strong><span>${time} · ${track.name}${item.uncertain ? "<br>年代約略或帶有傳說性質" : ""}${item.note ? `<br>${item.note}` : ""}<br><a href="${item.wiki}" target="_blank" rel="noopener">開啟維基百科</a></span>`;
      tooltip.style.display = "block";
      positionTooltip(event);
    }

    function positionTooltip(event) {
      const pad = 16;
      const rect = tooltip.getBoundingClientRect();
      let x = event.clientX + 14;
      let y = event.clientY + 14;
      if (x + rect.width + pad > window.innerWidth) x = event.clientX - rect.width - 14;
      if (y + rect.height + pad > window.innerHeight) y = event.clientY - rect.height - 14;
      tooltip.style.left = `${Math.max(pad, x)}px`;
      tooltip.style.top = `${Math.max(pad, y)}px`;
    }

    function isTouchLike() {
      return window.matchMedia?.("(pointer: coarse)")?.matches || viewport.width < 760;
    }

    canvas.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      const axisHit = axisHitAt(pointerPosition(event));
      if (axisHit) {
        toggleTrack(axisHit.trackId);
        return;
      }
      canvas.setPointerCapture(event.pointerId);
      isDragging = true;
      dragMoved = false;
      canvas.classList.add("dragging");
      dragStart = { x: event.clientX, y: event.clientY, tx: viewport.tx, ty: viewport.ty };
    });

    canvas.addEventListener("pointermove", event => {
      if (isDragging) {
        if (Math.abs(event.clientX - dragStart.x) + Math.abs(event.clientY - dragStart.y) > 6) dragMoved = true;
        viewport.tx = dragStart.tx + event.clientX - dragStart.x;
        viewport.ty = dragStart.ty + event.clientY - dragStart.y;
        clampViewport();
        draw();
        return;
      }
      const pos = pointerPosition(event);
      const hit = fixedHitAt(pos) || hitAt(screenToWorld(pos.x, pos.y));
      hovered = hit || null;
      showTooltip(event, hit);
    });

    canvas.addEventListener("pointerup", event => {
      if (isDragging) canvas.releasePointerCapture(event.pointerId);
      if (isDragging && !dragMoved && isTouchLike()) {
        const pos = pointerPosition(event);
        const hit = fixedHitAt(pos) || hitAt(screenToWorld(pos.x, pos.y));
        hovered = hit || null;
        showTooltip(event, hit);
      }
      isDragging = false;
      dragMoved = false;
      canvas.classList.remove("dragging");
    });

    canvas.addEventListener("pointercancel", () => {
      isDragging = false;
      canvas.classList.remove("dragging");
    });

    canvas.addEventListener("mouseleave", () => {
      hovered = null;
      tooltip.style.display = "none";
    });

    app.addEventListener("wheel", event => {
      if (event.target.closest(".search")) return;
      event.preventDefault();
      const pos = pointerPosition(event);
      zoomAt(pos.x, pos.y, event.deltaY < 0 ? 1.12 : .89);
    }, { passive: false });

    canvas.addEventListener("contextmenu", event => {
      const pos = pointerPosition(event);
      const hit = fixedHitAt(pos) || hitAt(screenToWorld(pos.x, pos.y));
      if (hit && hit.item.wiki) {
        event.preventDefault();
        window.open(hit.item.wiki, "_blank", "noopener");
      }
    });

    minimap.addEventListener("pointerdown", event => {
      minimap.setPointerCapture(event.pointerId);
      miniDragging = true;
      jumpFromMinimap(event);
    });

    minimap.addEventListener("pointermove", event => {
      if (miniDragging) jumpFromMinimap(event);
    });

    minimap.addEventListener("pointerup", event => {
      minimap.releasePointerCapture(event.pointerId);
      miniDragging = false;
    });

    function jumpFromMinimap(event) {
      const map = minimap._map;
      if (!map) return;
      const pos = pointerPosition(event, minimap);
      const wx = (pos.x - map.ox) / map.scale;
      const wy = (pos.y - map.oy) / map.scale;
      viewport.tx = viewport.width / 2 - wx * viewport.scale;
      viewport.ty = viewport.height / 2 - wy * viewport.scale;
      clampViewport();
      draw();
    }

    function validateData() {
      const issues = [];
      const allItems = [
        ...coreAxis.map(item => ({ ...item, kind: "coreAxis" })),
        ...rulers.map(item => ({ ...item, kind: "ruler" })),
        ...periods.map(item => ({ ...item, kind: "period" })),
        ...events.map(item => ({ ...item, kind: "event" }))
      ];
      const ids = new Map();
      allItems.forEach(item => {
        if (ids.has(item.id)) issues.push(`duplicate id: ${item.id}`);
        ids.set(item.id, item);
        const span = itemSpan(item);
        if (!Number.isFinite(span.start) || !Number.isFinite(span.end) || span.start > span.end) issues.push(`bad years: ${item.kind}/${item.id}`);
        if (span.start < ABS_YEAR_MIN || span.end > ABS_YEAR_MAX) issues.push(`year out of bounds: ${item.kind}/${item.id}`);
        if (!item.verified || !item.sourceLevel || !item.confidence) issues.push(`missing governance: ${item.kind}/${item.id}`);
      });
      const trackIds = new Set(tracks.map(track => track.id));
      [...periods, ...events.filter(item => !item.core)].forEach(item => {
        if (!trackIds.has(item.track)) issues.push(`unknown track: ${item.id} -> ${item.track}`);
        if ((item.lane || 0) >= laneCountForTrack(item.track)) issues.push(`lane overflow: ${item.id} lane ${item.lane}`);
      });
      const keyed = new Map();
      periods.forEach(item => {
        const key = `${item.track}:${Math.min(item.lane || 0, laneCountForTrack(item.track) - 1)}`;
        if (!keyed.has(key)) keyed.set(key, []);
        keyed.get(key).push(item);
      });
      keyed.forEach(items => {
        items.sort((a, b) => a.start - b.start).forEach((item, index, arr) => {
          const prev = arr[index - 1];
          if (prev && item.start < prev.end && item.id !== prev.id) issues.push(`period overlap: ${prev.id} / ${item.id}`);
        });
      });
      if (issues.length) console.warn("[history-data-validation]", issues);
      else console.info("[history-data-validation] OK");
      return issues;
    }

    timeRanges.forEach(range => {
      const option = document.createElement("option");
      option.value = range.id;
      option.textContent = range.label;
      rangeSelect.appendChild(option);
    });
    rangeSelect.value = activeRange.id;
    rangeSelect.addEventListener("change", () => applyTimeRange(rangeSelect.value));
    mobilePrevTrack.addEventListener("click", () => focusMobileTrack(mobileTrackIndex - 1));
    mobileNextTrack.addEventListener("click", () => focusMobileTrack(mobileTrackIndex + 1));
    document.getElementById("zoomIn").addEventListener("click", () => zoomAt(viewport.width / 2, viewport.height / 2, 1.22));
    document.getElementById("zoomOut").addEventListener("click", () => zoomAt(viewport.width / 2, viewport.height / 2, .82));
    document.getElementById("fit").addEventListener("click", fitAll);
    document.getElementById("fullscreen").addEventListener("click", () => {
      const root = document.getElementById("app");
      if (!document.fullscreenElement) root.requestFullscreen?.();
      else document.exitFullscreen?.();
    });
    eventPanelToggle.addEventListener("click", () => {
      const collapsed = eventPanel.classList.toggle("collapsed");
      eventPanelToggle.textContent = collapsed ? "大" : "×";
      eventPanelToggle.title = collapsed ? "展開大事年表" : "收合大事年表";
      if (!collapsed) updateEventPanel();
      clampViewport();
      setTimeout(draw, 0);
    });
    minimapToggle.addEventListener("click", () => {
      const collapsed = minimapPanel.classList.toggle("collapsed");
      minimapToggle.textContent = collapsed ? "圖" : "×";
      minimapToggle.title = collapsed ? "展開小地圖" : "收合小地圖";
      clampViewport();
      setTimeout(draw, 0);
    });
    document.addEventListener("fullscreenchange", () => {
      resize.didFit = false;
      setTimeout(resize, 80);
    });

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      suggestions.innerHTML = "";
      if (!q) {
        suggestions.classList.remove("visible");
        return;
      }
      const index = [
        ...coreAxis.map(item => ({ kind: "中原主軸", item, text: item.name, coreAxis: true })),
        ...rulers.map(item => ({ kind: "君主/首腦", item, text: item.name, ruler: true })),
        ...periods.map(item => ({ kind: "時期/政權", item, text: item.name })),
        ...events.map(item => ({ kind: "事件", item, text: item.name, event: true }))
      ];
      index.filter(entry => entry.text.toLowerCase().includes(q)).slice(0, 14).forEach(entry => {
        const div = document.createElement("div");
        const track = entry.ruler ? { name: entry.item.polity } : (entry.item.core || entry.coreAxis ? { name: "中原主軸" } : trackById.get(entry.item.track));
        const time = entry.event ? formatYear(entry.item.year) : `${formatYear(entry.item.start)} - ${formatYear(entry.item.end)}`;
        div.className = "suggestion";
        div.innerHTML = `${entry.text}<small>${entry.kind} · ${track.name} · ${time}</small>`;
        div.addEventListener("click", () => {
          ensureRangeForItem(entry.item);
          if (entry.ruler) {
            const y = (yearToY(entry.item.start) + yearToY(entry.item.end)) / 2;
            focusWorld(WORLD.left, y, .95);
            searchInput.value = entry.text;
            suggestions.classList.remove("visible");
            return;
          }
          if (entry.coreAxis || entry.item.core) {
            const y = entry.event ? yearToY(entry.item.year) : (yearToY(entry.item.start) + yearToY(entry.item.end)) / 2;
            focusWorld(WORLD.left, y, .95);
            searchInput.value = entry.text;
            suggestions.classList.remove("visible");
            return;
          }
          if (hiddenTracks.has(entry.item.track)) {
            hiddenTracks.delete(entry.item.track);
            computeLayout();
          }
          const box = laneBox(entry.item);
          if (!box) return;
          const y = entry.event ? yearToY(entry.item.year) : (yearToY(entry.item.start) + yearToY(entry.item.end)) / 2;
          focusWorld(box.x + box.width / 2, y, .95);
          searchInput.value = entry.text;
          suggestions.classList.remove("visible");
        });
        suggestions.appendChild(div);
      });
      suggestions.classList.toggle("visible", suggestions.children.length > 0);
    });

    window.addEventListener("click", event => {
      if (!event.target.closest(".search")) suggestions.classList.remove("visible");
    });

    validateData();
    computeLayout();
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
