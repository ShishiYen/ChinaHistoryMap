<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全世界歷史時間地圖</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f0df;
      --ink: #1b1b1b;
      --muted: #6d6557;
      --line: rgba(34, 28, 20, .18);
      --panel: rgba(255, 252, 244, .93);
      --shadow: 0 16px 42px rgba(30, 24, 14, .18);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #18140e;
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, .06), transparent 18%, transparent 82%, rgba(0, 0, 0, .08)),
        var(--paper);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    canvas.dragging { cursor: grabbing; }

    .toolbar {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(66, 54, 34, .18);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .toolbar.collapsed {
      width: 42px;
      height: 42px;
      padding: 4px;
      overflow: hidden;
    }

    .toolbar.collapsed > :not(.panel-toggle) { display: none; }

    .title {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 172px;
      padding: 0 8px 0 4px;
      border-right: 1px solid var(--line);
      line-height: 1.2;
    }

    .title strong {
      font-size: 15px;
      letter-spacing: 0;
    }

    .title span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    button {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(45, 38, 26, .18);
      border-radius: 7px;
      background: #fff8e8;
      color: #2f281c;
      font: 700 18px/1 system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover { background: #fff1cf; }

    .panel-toggle {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      font-size: 14px;
    }

    .search {
      position: relative;
      width: min(320px, 34vw);
    }

    .search input {
      width: 100%;
      height: 34px;
      border: 1px solid rgba(45, 38, 26, .18);
      border-radius: 7px;
      background: #fffbf0;
      color: #2a241b;
      padding: 0 34px 0 11px;
      font-size: 13px;
      outline: none;
    }

    .search input:focus {
      border-color: rgba(138, 84, 34, .6);
      box-shadow: 0 0 0 3px rgba(168, 103, 45, .14);
    }

    .search::after {
      content: "⌕";
      position: absolute;
      right: 10px;
      top: 4px;
      color: #8a7a62;
      font-size: 20px;
      pointer-events: none;
    }

    .suggestions {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      max-height: 280px;
      overflow: auto;
      border: 1px solid rgba(45, 38, 26, .18);
      border-radius: 8px;
      background: #fffbf0;
      box-shadow: var(--shadow);
      display: none;
    }

    .suggestions.visible { display: block; }

    .suggestion {
      padding: 9px 10px;
      border-bottom: 1px solid rgba(45, 38, 26, .08);
      cursor: pointer;
      font-size: 13px;
    }

    .suggestion:hover { background: #fff0cf; }

    .suggestion small {
      display: block;
      margin-top: 2px;
      color: #766a58;
      font-size: 11px;
    }

    .legend {
      position: absolute;
      left: 14px;
      bottom: 96px;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid rgba(66, 54, 34, .18);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: #3b3326;
      font-size: 12px;
    }

    .legend-popover {
      position: absolute;
      top: 66px;
      left: 14px;
      display: none;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid rgba(66, 54, 34, .18);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: #3b3326;
      font-size: 12px;
    }

    .legend-popover.visible { display: flex; }

    .legend-item {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      white-space: nowrap;
    }

    .swatch {
      width: 18px;
      height: 10px;
      border: 1px solid rgba(0, 0, 0, .24);
      border-radius: 2px;
    }

    .minimap-wrap {
      position: static;
      width: 137px;
      height: 195px;
      padding: 8px;
      border: 1px solid rgba(66, 54, 34, .2);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    #minimap {
      position: static;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      background: #fbf2dc;
      cursor: crosshair;
    }

    .tooltip {
      position: absolute;
      z-index: 10;
      min-width: 168px;
      max-width: 250px;
      padding: 7px 8px;
      border: 1px solid rgba(45, 38, 26, .18);
      border-radius: 6px;
      background: rgba(31, 26, 18, .98);
      color: #fff7e8;
      box-shadow: 0 10px 22px rgba(0, 0, 0, .34);
      pointer-events: none;
      display: none;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
    }

    .tooltip span {
      color: #f0dcb5;
      font-size: 10px;
      line-height: 1.35;
    }

    .status {
      max-width: 360px;
      padding: 8px 10px;
      border: 1px solid rgba(66, 54, 34, .18);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: #4b4030;
      font-size: 12px;
      line-height: 1.45;
    }

    .right-dock {
      position: absolute;
      right: 14px;
      top: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .right-dock .dock-head {
      display: flex;
      justify-content: flex-end;
      width: 100%;
    }

    .right-dock.collapsed {
      width: 42px;
      min-height: 104px;
      padding: 4px;
      border: 1px solid rgba(66, 54, 34, .18);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      align-items: center;
    }

    .right-dock.collapsed .status,
    .right-dock.collapsed .minimap-wrap { display: none; }

    .right-dock.collapsed::after {
      content: "資訊";
      writing-mode: vertical-rl;
      color: #5a4b36;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .legend.collapsed {
      width: 42px;
      height: 42px;
      padding: 4px;
      overflow: hidden;
    }

    .legend.collapsed .legend-item { display: none; }

    @media (max-width: 760px) {
      .toolbar {
        left: 8px;
        right: 8px;
        flex-wrap: wrap;
      }

      .title {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 2px 4px 7px;
      }

      .search {
        flex: 1 1 190px;
        width: auto;
      }

      .status {
        max-width: min(260px, calc(100vw - 16px));
      }

      .legend {
        display: none;
      }

      .right-dock {
        right: 8px;
        top: auto;
        bottom: 8px;
      }

      .minimap-wrap {
        width: 96px;
        height: 138px;
        padding: 6px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="timeline" aria-label="全世界歷史時間地圖"></canvas>
    <div class="toolbar">
      <button id="toolbarToggle" class="panel-toggle" type="button" title="收合工具列">×</button>
      <div class="title">
        <strong>全世界歷史時間地圖</strong>
        <span>西元前 3500 → 2026，古代在下</span>
      </div>
      <button id="zoomIn" type="button" title="放大">+</button>
      <button id="zoomOut" type="button" title="縮小">−</button>
      <button id="fit" type="button" title="回到全圖">⌂</button>
      <button id="fullscreen" type="button" title="全螢幕">⛶</button>
      <button id="legendMenu" type="button" title="圖例">圖</button>
      <button id="chinaPage" type="button" title="中國史">中</button>
      <div class="search">
        <input id="searchInput" type="search" placeholder="搜尋文明、朝代或事件" autocomplete="off">
        <div id="suggestions" class="suggestions"></div>
      </div>
    </div>
    <div id="legendPopover" class="legend-popover">
      <span class="legend-item"><i class="swatch" style="background:#b94c3a"></i>政權/文明</span>
      <span class="legend-item"><i class="swatch" style="background:rgba(70,70,70,.48)"></i>直接統治</span>
      <span class="legend-item"><i class="swatch" style="background:rgba(70,70,70,.26)"></i>征服/政治壓力</span>
      <span class="legend-item"><i class="swatch" style="background:rgba(70,70,70,.14)"></i>文化/貿易影響</span>
    </div>
    <div id="rightDock" class="right-dock">
      <div class="dock-head">
        <button id="rightDockToggle" class="panel-toggle" type="button" title="收合資訊欄">×</button>
      </div>
      <div class="status">
        拖曳移動畫面，滾輪縮放。事件點可滑過查看，右鍵開啟維基百科。資料為第一版人工策展與 Wikidata/Wikipedia 名稱連結整理。
      </div>
      <div class="minimap-wrap">
        <canvas id="minimap" aria-label="時間地圖縮圖"></canvas>
      </div>
    </div>
    <div id="tooltip" class="tooltip"></div>
  </div>

    const regionById = new Map(regions.map((region, index) => [region.id, { ...region, index }]));
    const canvas = document.getElementById("timeline");
    const app = document.getElementById("app");
    const ctx = canvas.getContext("2d");
    const minimap = document.getElementById("minimap");
    const mctx = minimap.getContext("2d");
    const tooltip = document.getElementById("tooltip");
    const suggestions = document.getElementById("suggestions");

    let regionLayout = [];
    let hits = [];
    let axisHits = [];
    let hovered = null;
    let focused = null;
    const hiddenRegions = new Set();
    let isDragging = false;
    let minimapDragging = false;
    let dragStart = { x: 0, y: 0, tx: 0, ty: 0 };

    const viewport = {
      dpr: 1,
      width: 0,
      height: 0,
      tx: 0,
      ty: 0,
      scale: 0.24,
      minScale: 0.12,
      maxScale: 2.8
    };

    function p(id, name, region, lane, start, end, wikiTitle) {
      return { id, name, region, lane, start, end, wiki: wiki(wikiTitle || name) };
    }

    function inf(id, name, start, end, from, to, level, wikiTitle) {
      return { id, name, start, end, from, to, level, wiki: wiki(wikiTitle || name) };
    }

    function e(id, name, year, region, lane, wikiTitle) {
      return { id, name, year, region, lane, wiki: wiki(wikiTitle || name) };
    }

    function computeLayout() {
      let x = WORLD.left;
      const visibleRegions = regions.filter((region) => !hiddenRegions.has(region.id));
      regionLayout = visibleRegions.map((region) => {
        const layout = { ...region, x, width: WORLD.regionWidth, right: x + WORLD.regionWidth };
        x += WORLD.regionWidth + WORLD.gap;
        return layout;
      });
      const count = Math.max(1, visibleRegions.length);
      WORLD.width = WORLD.left + WORLD.right + count * WORLD.regionWidth + Math.max(0, count - 1) * WORLD.gap;
      WORLD.totalHeight = WORLD.top + WORLD.height + WORLD.bottom;
    }

    function regionInfo(id) {
      return regionLayout.find((region) => region.id === id);
    }

    function yearToY(year) {
      const t = (YEAR_MAX - year) / (YEAR_MAX - YEAR_MIN);
      return WORLD.top + t * WORLD.height;
    }

    function yToYear(y) {
      const t = (y - WORLD.top) / WORLD.height;
      return Math.round(YEAR_MAX - t * (YEAR_MAX - YEAR_MIN));
    }

    function yearPixels() {
      return (WORLD.height / (YEAR_MAX - YEAR_MIN)) * viewport.scale;
    }

    function tickSteps() {
      const px = yearPixels();
      if (px >= 11) return { major: 10, minor: 1, label: 5 };
      if (px >= 6) return { major: 25, minor: 5, label: 10 };
      if (px >= 3) return { major: 50, minor: 10, label: 25 };
      if (px >= 1.4) return { major: 100, minor: 25, label: 50 };
      if (px >= .65) return { major: 250, minor: 50, label: 100 };
      return { major: 500, minor: 100, label: 500 };
    }

    function alignedStart(step) {
      return Math.ceil(YEAR_MIN / step) * step;
    }

    function screenToWorld(x, y) {
      return {
        x: (x - viewport.tx) / viewport.scale,
        y: (y - viewport.ty) / viewport.scale
      };
    }

    function worldToScreen(x, y) {
      return {
        x: x * viewport.scale + viewport.tx,
        y: y * viewport.scale + viewport.ty
      };
    }

    function clampViewport() {
      const minTx = viewport.width - WORLD.width * viewport.scale - 80;
      const maxTx = 80;
      const minTy = viewport.height - WORLD.totalHeight * viewport.scale - 80;
      const maxTy = 80;
      viewport.tx = Math.min(maxTx, Math.max(minTx, viewport.tx));
      viewport.ty = Math.min(maxTy, Math.max(minTy, viewport.ty));
    }

    function fitAll() {
      const scaleX = viewport.width / WORLD.width;
      const scaleY = viewport.height / WORLD.totalHeight;
      viewport.scale = Math.min(scaleX, scaleY) * 0.94;
      viewport.minScale = viewport.scale * 0.76;
      viewport.tx = (viewport.width - WORLD.width * viewport.scale) / 2;
      viewport.ty = (viewport.height - WORLD.totalHeight * viewport.scale) / 2;
      draw();
    }

    function initialView() {
      if (viewport.width < 760) {
        fitAll();
        return;
      }
      const fitWidth = (viewport.width / WORLD.width) * 0.92;
      viewport.scale = Math.min(0.56, Math.max(0.34, fitWidth));
      viewport.minScale = Math.min(viewport.scale * 0.5, (viewport.height / WORLD.totalHeight) * 0.72);
      viewport.tx = (viewport.width - WORLD.width * viewport.scale) / 2;
      viewport.ty = viewport.height / 2 - yearToY(700) * viewport.scale;
      clampViewport();
      draw();
    }

    function zoomAt(cx, cy, factor) {
      const before = screenToWorld(cx, cy);
      viewport.scale = Math.min(viewport.maxScale, Math.max(viewport.minScale, viewport.scale * factor));
      viewport.tx = cx - before.x * viewport.scale;
      viewport.ty = cy - before.y * viewport.scale;
      clampViewport();
      draw();
    }

    function focusWorld(x, y, scale = Math.max(viewport.scale, 0.62)) {
      viewport.scale = Math.min(viewport.maxScale, Math.max(viewport.minScale, scale));
      viewport.tx = viewport.width / 2 - x * viewport.scale;
      viewport.ty = viewport.height / 2 - y * viewport.scale;
      clampViewport();
      draw();
    }

    function laneBox(item) {
      const region = regionInfo(item.region);
      if (!region) return null;
      const laneGap = 5;
      if (isDominantPolity(item)) {
        return { x: region.x + laneGap, width: region.width - laneGap * 2, region };
      }
      const laneWidth = (region.width - laneGap * (region.lanes + 1)) / region.lanes;
      const x = region.x + laneGap + item.lane * (laneWidth + laneGap);
      return { x, width: laneWidth, region };
    }

    function isDominantPolity(item) {
      if (typeof item.start !== "number" || typeof item.end !== "number") return false;
      if (item.lane !== 0) return false;
      return !polities.some((other) => {
        if (other.id === item.id || other.region !== item.region) return false;
        const overlap = Math.min(item.end, other.end) - Math.max(item.start, other.start);
        return overlap > 20;
      });
    }

    function formatYear(year) {
      if (year < 0) return `西元前 ${Math.abs(year)}`;
      return `西元 ${year}`;
    }

    function draw() {
      ctx.setTransform(viewport.dpr, 0, 0, viewport.dpr, 0, 0);
      ctx.clearRect(0, 0, viewport.width, viewport.height);
      ctx.save();
      ctx.translate(viewport.tx, viewport.ty);
      ctx.scale(viewport.scale, viewport.scale);
      drawWorld(ctx, false);
      ctx.restore();
      drawFixedAxes();
      drawMinimap();
    }

    function drawWorld(context, mini) {
      hits = mini ? hits : [];
      drawBackground(context, mini);
      drawYearGrid(context, mini);
      drawRegions(context, mini);
      drawInfluences(context, mini);
      drawPolities(context, mini);
      drawEvents(context, mini);
      drawFocus(context, mini);
    }

    function drawBackground(context, mini) {
      context.fillStyle = "#f7f0df";
      context.fillRect(0, 0, WORLD.width, WORLD.totalHeight);
      context.fillStyle = "rgba(116, 94, 58, .08)";
      context.fillRect(WORLD.left - 44, WORLD.top, 34, WORLD.height);
      if (!mini) {
        context.fillStyle = "#2e281f";
        context.font = "700 38px 'Microsoft JhengHei', sans-serif";
        context.fillText("WORLD HISTORY", WORLD.left, 54);
        context.font = "600 18px 'Microsoft JhengHei', sans-serif";
        context.fillStyle = "#6a5a42";
        context.fillText("西元前 3500 - 西元 2026，古代在下，現代在上", WORLD.left, 78);
      }
    }

    function drawYearGrid(context, mini) {
      const steps = mini ? { major: 500, minor: 250, label: 500 } : tickSteps();
      context.textAlign = "right";
      context.textBaseline = "middle";
      for (let year = alignedStart(steps.minor); year <= YEAR_MAX; year += steps.minor) {
        const y = yearToY(year);
        const isMajor = year % steps.major === 0;
        context.strokeStyle = isMajor ? "rgba(61, 48, 31, .28)" : "rgba(61, 48, 31, .09)";
        context.lineWidth = isMajor ? 1.2 : .7;
        context.beginPath();
        context.moveTo(WORLD.left - 12, y);
        context.lineTo(WORLD.width - WORLD.right + 14, y);
        context.stroke();
        if (!mini && year % steps.label === 0) {
          context.fillStyle = "#5f513d";
          context.font = steps.label <= 25 ? "600 12px 'Microsoft JhengHei', sans-serif" : "600 18px 'Microsoft JhengHei', sans-serif";
          context.fillText(year < 0 ? `前${Math.abs(year)}` : `${year}`, WORLD.left - 20, y);
        }
      }
      const nowY = yearToY(2026);
      context.strokeStyle = "rgba(30, 30, 30, .38)";
      context.beginPath();
      context.moveTo(WORLD.left - 12, nowY);
      context.lineTo(WORLD.width - WORLD.right + 14, nowY);
      context.stroke();
    }

    function drawRegions(context, mini) {
      regionLayout.forEach((region) => {
        context.fillStyle = hexToRgba(region.color, mini ? .09 : .075);
        context.fillRect(region.x, WORLD.top, region.width, WORLD.height);
        context.strokeStyle = "rgba(43, 34, 22, .24)";
        context.lineWidth = 1.5;
        context.strokeRect(region.x, WORLD.top, region.width, WORLD.height);

        const laneGap = 5;
        const laneWidth = (region.width - laneGap * (region.lanes + 1)) / region.lanes;
        for (let i = 1; i < region.lanes; i++) {
          const x = region.x + laneGap + i * (laneWidth + laneGap) - laneGap / 2;
          context.strokeStyle = "rgba(40, 31, 20, .12)";
          context.beginPath();
          context.moveTo(x, WORLD.top);
          context.lineTo(x, WORLD.top + WORLD.height);
          context.stroke();
        }

        if (!mini) {
          context.save();
          context.translate(region.x + region.width / 2, WORLD.top - 14);
          context.textAlign = "center";
          context.textBaseline = "bottom";
          context.fillStyle = "#2c251a";
          context.font = "700 18px 'Microsoft JhengHei', sans-serif";
          context.fillText(region.name, 0, 0);
          context.restore();
        }
      });
    }

    function drawInfluences(context, mini) {
      influences.forEach((item) => {
        const from = regionInfo(item.from);
        const to = regionInfo(item.to);
        if (!from || !to) return;
        const x = Math.min(from.x, to.x);
        const right = Math.max(from.right, to.right);
        const y1 = yearToY(item.end);
        const y2 = yearToY(item.start);
        const alpha = item.level === 3 ? .34 : item.level === 2 ? .2 : .11;
        context.fillStyle = `rgba(43, 43, 43, ${mini ? alpha * 1.4 : alpha})`;
        roundRect(context, x + 2, y1, right - x - 4, Math.max(2, y2 - y1), mini ? 1 : 8);
        context.fill();
        context.strokeStyle = item.level === 3 ? "rgba(30,30,30,.52)" : "rgba(30,30,30,.24)";
        context.setLineDash(item.level === 1 ? [10, 10] : []);
        context.stroke();
        context.setLineDash([]);
        if (!mini && y2 - y1 > 30) {
          context.save();
          context.globalAlpha = .82;
          context.fillStyle = "#29251e";
          context.font = "700 15px 'Microsoft JhengHei', sans-serif";
          context.textAlign = "left";
          context.textBaseline = "top";
          context.fillText(item.name, x + 10, y1 + 8);
          context.restore();
        }
      });
    }

    function drawPolities(context, mini) {
      polities.forEach((item) => {
        if (hiddenRegions.has(item.region)) return;
        const box = laneBox(item);
        if (!box) return;
        const region = box.region;
        const y1 = yearToY(item.end);
        const y2 = yearToY(item.start);
        const h = Math.max(5, y2 - y1);
        const isFocused = focused && focused.id === item.id;
        context.fillStyle = hexToRgba(region.color, mini ? .72 : .82);
        roundRect(context, box.x, y1, box.width, h, mini ? 1 : 4);
        context.fill();
        context.strokeStyle = isFocused ? "#111" : "rgba(33, 26, 18, .48)";
        context.lineWidth = isFocused ? 4 : 1.2;
        context.stroke();

        if (!mini) {
          drawPolityLabel(context, item, box, y1, h, region);
          hits.push({ type: "polity", item, x: box.x, y: y1, w: box.width, h });
        }
      });
    }

    function drawPolityLabel(context, item, box, y, height, region) {
      if (height < 8 || box.width < 10) return;
      context.save();
      context.beginPath();
      context.rect(box.x + 2, y + 2, box.width - 4, height - 4);
      context.clip();
      context.fillStyle = readableText(region.color);
      context.textAlign = "center";
      context.textBaseline = "middle";

      const name = item.name;
      const horizontalSize = Math.max(9, Math.min(18, Math.min(box.width / Math.max(2, name.length * .78), height / 2.2)));
      context.font = `800 ${horizontalSize}px 'Microsoft JhengHei', sans-serif`;
      const horizontalFits = context.measureText(name).width <= box.width - 8 && height >= horizontalSize + 8;
      const verticalSize = Math.max(8, Math.min(15, Math.min(box.width - 6, height / Math.max(2, name.length) * .95)));
      const verticalFits = height >= name.length * verticalSize * .82 + 8 && box.width >= verticalSize + 6;

      if (horizontalFits) {
        context.font = `800 ${horizontalSize}px 'Microsoft JhengHei', sans-serif`;
        context.fillText(name, box.x + box.width / 2, y + height / 2);
      } else if (verticalFits) {
        drawVerticalText(context, name, box.x + box.width / 2, y + height / 2, verticalSize);
      } else if (height >= 14 && box.width >= 14) {
        const compact = name.length > 4 ? `${name.slice(0, 3)}…` : name;
        const compactSize = Math.max(8, Math.min(12, box.width / Math.max(1.4, compact.length * .72), height - 4));
        context.font = `800 ${compactSize}px 'Microsoft JhengHei', sans-serif`;
        if (context.measureText(compact).width <= box.width - 4) {
          context.fillText(compact, box.x + box.width / 2, y + height / 2);
        } else {
          drawVerticalText(context, compact.replace("…", ""), box.x + box.width / 2, y + height / 2, Math.max(7, Math.min(10, box.width - 5)));
        }
      }

      if (height > 64 && box.width > 54) {
        context.font = "600 9px 'Microsoft JhengHei', sans-serif";
        context.globalAlpha = .78;
        context.fillText(`${formatYear(item.start)} - ${formatYear(item.end)}`, box.x + box.width / 2, y + height - 10);
      }
      context.restore();
    }

    function drawVerticalText(context, text, x, y, size) {
      const chars = [...text];
      const step = size * .9;
      context.font = `800 ${size}px 'Microsoft JhengHei', sans-serif`;
      chars.forEach((char, index) => {
        context.fillText(char, x, y - ((chars.length - 1) * step) / 2 + index * step);
      });
    }

    function drawEvents(context, mini) {
      events.forEach((item) => {
        if (hiddenRegions.has(item.region)) return;
        const box = laneBox(item);
        if (!box) return;
        const x = box.x + box.width / 2;
        const y = yearToY(item.year);
        const radius = mini ? 1.7 : 5.6;
        context.fillStyle = "#fff4bd";
        context.strokeStyle = "#3a3020";
        context.lineWidth = mini ? .7 : 1.5;
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.fill();
        context.stroke();
        if (!mini) {
          hits.push({ type: "event", item, x: x - 9, y: y - 9, w: 18, h: 18, cx: x, cy: y });
        }
      });
    }

    function drawFocus(context, mini) {
      if (!focused || mini) return;
      const target = focused.type === "event" ? focused.item : focused;
      context.save();
      context.strokeStyle = "#111";
      context.lineWidth = 3;
      context.setLineDash([12, 8]);
      if (focused.type === "event") {
        const box = laneBox(target);
        const x = box.x + box.width / 2;
        const y = yearToY(target.year);
        context.beginPath();
        context.arc(x, y, 18, 0, Math.PI * 2);
        context.stroke();
      }
      context.restore();
    }

    function drawFixedAxes() {
      const axisY = viewport.height - 34;
      axisHits = [];
      ctx.save();
      ctx.setTransform(viewport.dpr, 0, 0, viewport.dpr, 0, 0);
      ctx.font = "700 12px 'Microsoft JhengHei', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      regionLayout.forEach((region) => {
        const left = region.x * viewport.scale + viewport.tx;
        const right = region.right * viewport.scale + viewport.tx;
        if (right < 0 || left > viewport.width) return;
        const x = Math.max(0, left);
        const width = Math.min(viewport.width, right) - x;
        if (width < 34) return;
        ctx.fillStyle = hexToRgba(region.color, .82);
        roundRect(ctx, x + 2, axisY, Math.max(8, width - 4), 24, 4);
        ctx.fill();
        ctx.fillStyle = readableText(region.color);
        const buttonSize = 18;
        const buttonX = x + width - buttonSize - 5;
        const labelWidth = Math.max(20, width - buttonSize - 12);
        ctx.save();
        ctx.beginPath();
        ctx.rect(x + 4, axisY + 2, labelWidth - 4, 20);
        ctx.clip();
        ctx.fillText(region.name, x + labelWidth / 2, axisY + 12);
        ctx.restore();
        ctx.fillStyle = "rgba(255, 250, 238, .88)";
        roundRect(ctx, buttonX, axisY + 3, buttonSize, buttonSize, 4);
        ctx.fill();
        ctx.fillStyle = "#352c20";
        ctx.font = "800 13px 'Microsoft JhengHei', sans-serif";
        ctx.fillText("×", buttonX + buttonSize / 2, axisY + 12);
        ctx.font = "700 12px 'Microsoft JhengHei', sans-serif";
        axisHits.push({ regionId: region.id, x: buttonX, y: axisY + 3, w: buttonSize, h: buttonSize });
      });

      if (hiddenRegions.size > 0) {
        let chipX = 14;
        const chipY = axisY - 31;
        ctx.textAlign = "left";
        ctx.font = "700 11px 'Microsoft JhengHei', sans-serif";
        ctx.fillStyle = "rgba(31, 26, 18, .88)";
        ctx.fillText("已隱藏", chipX, chipY + 12);
        chipX += 50;
        regions.filter((region) => hiddenRegions.has(region.id)).forEach((region) => {
          const text = `+ ${region.name}`;
          const w = Math.min(112, Math.max(54, ctx.measureText(text).width + 16));
          if (chipX + w > viewport.width - 12) return;
          ctx.fillStyle = "rgba(255, 250, 238, .92)";
          roundRect(ctx, chipX, chipY, w, 22, 5);
          ctx.fill();
          ctx.strokeStyle = "rgba(45, 38, 26, .18)";
          ctx.stroke();
          ctx.fillStyle = "#3d3223";
          ctx.fillText(text, chipX + 8, chipY + 12);
          axisHits.push({ regionId: region.id, x: chipX, y: chipY, w, h: 22 });
          chipX += w + 6;
        });
        ctx.textAlign = "center";
      }

      ctx.textAlign = "right";
      const steps = tickSteps();
      ctx.font = steps.label <= 25 ? "700 10px 'Microsoft JhengHei', sans-serif" : "700 12px 'Microsoft JhengHei', sans-serif";
      for (let year = alignedStart(steps.label); year <= YEAR_MAX; year += steps.label) {
        const y = yearToY(year) * viewport.scale + viewport.ty;
        if (y < 0 || y > viewport.height) continue;
        ctx.strokeStyle = "rgba(26, 22, 16, .28)";
        ctx.beginPath();
        ctx.moveTo(84, y);
        ctx.lineTo(viewport.width, y);
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 250, 238, .9)";
        roundRect(ctx, 14, y - 11, 62, 22, 4);
        ctx.fill();
        ctx.fillStyle = "#463827";
        ctx.fillText(year < 0 ? `前${Math.abs(year)}` : `${year}`, 69, y);
      }

      const centerYear = yToYear(screenToWorld(0, viewport.height / 2).y);
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(31, 26, 18, .9)";
      roundRect(ctx, 14, viewport.height - 86, 126, 28, 5);
      ctx.fill();
      ctx.fillStyle = "#fff7e8";
      ctx.font = "700 12px 'Microsoft JhengHei', sans-serif";
      ctx.fillText(`視窗中心：${formatYear(centerYear)}`, 24, viewport.height - 72);
      ctx.restore();
    }

    function drawMinimap() {
      const rect = minimap.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return;
      const dpr = window.devicePixelRatio || 1;
      if (minimap.width !== Math.floor(rect.width * dpr) || minimap.height !== Math.floor(rect.height * dpr)) {
        minimap.width = Math.floor(rect.width * dpr);
        minimap.height = Math.floor(rect.height * dpr);
      }
      mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mctx.clearRect(0, 0, rect.width, rect.height);
      const scale = Math.min(rect.width / WORLD.width, rect.height / WORLD.totalHeight);
      const ox = (rect.width - WORLD.width * scale) / 2;
      const oy = (rect.height - WORLD.totalHeight * scale) / 2;
      mctx.save();
      mctx.translate(ox, oy);
      mctx.scale(scale, scale);
      drawWorld(mctx, true);
      mctx.restore();

      const worldLeft = -viewport.tx / viewport.scale;
      const worldTop = -viewport.ty / viewport.scale;
      const worldW = viewport.width / viewport.scale;
      const worldH = viewport.height / viewport.scale;
      mctx.strokeStyle = "#111";
      mctx.lineWidth = 2;
      mctx.fillStyle = "rgba(255,255,255,.24)";
      mctx.fillRect(ox + worldLeft * scale, oy + worldTop * scale, worldW * scale, worldH * scale);
      mctx.strokeRect(ox + worldLeft * scale, oy + worldTop * scale, worldW * scale, worldH * scale);
      minimap._map = { scale, ox, oy };
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      viewport.dpr = window.devicePixelRatio || 1;
      viewport.width = rect.width;
      viewport.height = rect.height;
      canvas.width = Math.floor(rect.width * viewport.dpr);
      canvas.height = Math.floor(rect.height * viewport.dpr);
      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;
      if (!resize.didFit) {
        initialView();
        resize.didFit = true;
      } else {
        clampViewport();
        draw();
      }
    }

    function pointerPosition(event, target = canvas) {
      const rect = target.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      const axisHit = axisHitAt(pointerPosition(event));
      if (axisHit) {
        toggleRegion(axisHit.regionId);
        return;
      }
      canvas.setPointerCapture(event.pointerId);
      isDragging = true;
      canvas.classList.add("dragging");
      dragStart = { x: event.clientX, y: event.clientY, tx: viewport.tx, ty: viewport.ty };
    });

    canvas.addEventListener("pointermove", (event) => {
      if (isDragging) {
        viewport.tx = dragStart.tx + event.clientX - dragStart.x;
        viewport.ty = dragStart.ty + event.clientY - dragStart.y;
        clampViewport();
        draw();
        return;
      }
      const pos = pointerPosition(event);
      const world = screenToWorld(pos.x, pos.y);
      const hit = hitAt(world);
      hovered = hit || null;
      showTooltip(event, hit);
    });

    canvas.addEventListener("pointerup", (event) => {
      if (isDragging) canvas.releasePointerCapture(event.pointerId);
      isDragging = false;
      canvas.classList.remove("dragging");
    });

    canvas.addEventListener("pointercancel", () => {
      isDragging = false;
      canvas.classList.remove("dragging");
    });

    canvas.addEventListener("mouseleave", () => {
      hovered = null;
      tooltip.style.display = "none";
    });

    app.addEventListener("wheel", (event) => {
      if (event.target.closest(".search")) return;
      event.preventDefault();
      const factor = event.deltaY < 0 ? 1.12 : 0.89;
      const pos = pointerPosition(event);
      zoomAt(pos.x, pos.y, factor);
    }, { passive: false });

    canvas.addEventListener("contextmenu", (event) => {
      const pos = pointerPosition(event);
      const hit = hitAt(screenToWorld(pos.x, pos.y));
      if (hit && hit.item && hit.item.wiki) {
        event.preventDefault();
        window.open(hit.item.wiki, "_blank", "noopener");
      }
    });

    function hitAt(world) {
      return [...hits].reverse().find((h) => world.x >= h.x && world.x <= h.x + h.w && world.y >= h.y && world.y <= h.y + h.h);
    }

    function axisHitAt(point) {
      return [...axisHits].reverse().find((h) => point.x >= h.x && point.x <= h.x + h.w && point.y >= h.y && point.y <= h.y + h.h);
    }

    function toggleRegion(regionId) {
      if (hiddenRegions.has(regionId)) {
        hiddenRegions.delete(regionId);
      } else {
        if (regions.length - hiddenRegions.size <= 1) return;
        hiddenRegions.add(regionId);
      }
      computeLayout();
      hovered = null;
      tooltip.style.display = "none";
      clampViewport();
      draw();
    }

    minimap.addEventListener("pointerdown", (event) => {
      minimap.setPointerCapture(event.pointerId);
      minimapDragging = true;
      jumpFromMinimap(event);
    });

    minimap.addEventListener("pointermove", (event) => {
      if (minimapDragging) jumpFromMinimap(event);
    });

    minimap.addEventListener("pointerup", (event) => {
      minimap.releasePointerCapture(event.pointerId);
      minimapDragging = false;
    });

    function jumpFromMinimap(event) {
      const pos = pointerPosition(event, minimap);
      const map = minimap._map;
      if (!map) return;
      const wx = (pos.x - map.ox) / map.scale;
      const wy = (pos.y - map.oy) / map.scale;
      viewport.tx = viewport.width / 2 - wx * viewport.scale;
      viewport.ty = viewport.height / 2 - wy * viewport.scale;
      clampViewport();
      draw();
    }

    document.getElementById("zoomIn").addEventListener("click", () => zoomAt(viewport.width / 2, viewport.height / 2, 1.22));
    document.getElementById("zoomOut").addEventListener("click", () => zoomAt(viewport.width / 2, viewport.height / 2, .82));
    document.getElementById("fit").addEventListener("click", fitAll);
    document.getElementById("fullscreen").addEventListener("click", toggleFullscreen);
    document.getElementById("chinaPage").addEventListener("click", () => {
      window.location.href = "china-history.html";
    });
    document.getElementById("legendMenu").addEventListener("click", (event) => {
      event.stopPropagation();
      document.getElementById("legendPopover").classList.toggle("visible");
    });
    bindCollapse("toolbarToggle", ".toolbar", "×", "☰");
    bindCollapse("rightDockToggle", "#rightDock", "×", "i");

    document.addEventListener("fullscreenchange", () => {
      document.getElementById("fullscreen").textContent = document.fullscreenElement ? "⛶" : "⛶";
      resize.didFit = false;
      setTimeout(resize, 80);
    });

    function toggleFullscreen() {
      const root = document.getElementById("app");
      if (!document.fullscreenElement) {
        root.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    function bindCollapse(buttonId, panelSelector, openText, closedText) {
      const button = document.getElementById(buttonId);
      const panel = document.querySelector(panelSelector);
      button.addEventListener("click", () => {
        panel.classList.toggle("collapsed");
        const collapsed = panel.classList.contains("collapsed");
        button.textContent = collapsed ? closedText : openText;
        button.title = collapsed ? "展開" : "收合";
        setTimeout(draw, 0);
      });
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      suggestions.innerHTML = "";
      if (!q) {
        suggestions.classList.remove("visible");
        return;
      }
      const index = [
        ...polities.map((item) => ({ kind: "文明/政權", text: item.name, item })),
        ...events.map((item) => ({ kind: "事件", text: item.name, item, type: "event" }))
      ];
      const matches = index.filter((entry) => entry.text.toLowerCase().includes(q)).slice(0, 12);
      matches.forEach((entry) => {
        const div = document.createElement("div");
        div.className = "suggestion";
        const region = regionById.get(entry.item.region);
        const time = entry.kind === "事件"
          ? formatYear(entry.item.year)
          : `${formatYear(entry.item.start)} - ${formatYear(entry.item.end)}`;
        div.innerHTML = `${entry.text}<small>${entry.kind} · ${region.name} · ${time}</small>`;
        div.addEventListener("click", () => {
          if (hiddenRegions.has(entry.item.region)) {
            hiddenRegions.delete(entry.item.region);
            computeLayout();
          }
          focused = entry.type === "event" ? { type: "event", item: entry.item } : entry.item;
          const box = laneBox(entry.item);
          if (!box) return;
          const y = entry.type === "event" ? yearToY(entry.item.year) : (yearToY(entry.item.start) + yearToY(entry.item.end)) / 2;
          focusWorld(box.x + box.width / 2, y, .8);
          suggestions.classList.remove("visible");
          searchInput.value = entry.text;
        });
        suggestions.appendChild(div);
      });
      suggestions.classList.toggle("visible", matches.length > 0);
    });

    window.addEventListener("click", (event) => {
      if (!event.target.closest(".search")) suggestions.classList.remove("visible");
      if (!event.target.closest("#legendPopover") && !event.target.closest("#legendMenu")) {
        document.getElementById("legendPopover").classList.remove("visible");
      }
    });

    function showTooltip(event, hit) {
      if (!hit) {
        tooltip.style.display = "none";
        return;
      }
      const item = hit.item;
      const region = regionById.get(item.region);
      const isEvent = hit.type === "event";
      tooltip.innerHTML = isEvent
        ? `<strong>${item.name}</strong><span>${formatYear(item.year)} · ${region.name}<br>右鍵開啟維基百科</span>`
        : `<strong>${item.name}</strong><span>${formatYear(item.start)} - ${formatYear(item.end)} · ${region.name}<br>右鍵開啟維基百科</span>`;
      tooltip.style.display = "block";
      const pad = 16;
      const rect = tooltip.getBoundingClientRect();
      let x = event.clientX + 14;
      let y = event.clientY + 14;
      if (x + rect.width + pad > window.innerWidth) x = event.clientX - rect.width - 14;
      if (y + rect.height + pad > window.innerHeight) y = event.clientY - rect.height - 14;
      tooltip.style.left = `${Math.max(pad, x)}px`;
      tooltip.style.top = `${Math.max(pad, y)}px`;
    }

    function hexToRgba(hex, alpha) {
      const value = hex.replace("#", "");
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function readableText(hex) {
      const value = hex.replace("#", "");
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > .58 ? "#211b12" : "#fff7e8";
    }

    function roundRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.lineTo(x + width - r, y);
      context.quadraticCurveTo(x + width, y, x + width, y + r);
      context.lineTo(x + width, y + height - r);
      context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      context.lineTo(x + r, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - r);
      context.lineTo(x, y + r);
      context.quadraticCurveTo(x, y, x + r, y);
      context.closePath();
    }

    function wrapCenterText(context, text, x, y, maxWidth, lineHeight) {
      if (context.measureText(text).width <= maxWidth) {
        context.fillText(text, x, y);
        return;
      }
      const chars = [...text];
      const lines = [];
      let line = "";
      chars.forEach((char) => {
        const next = line + char;
        if (context.measureText(next).width > maxWidth && line) {
          lines.push(line);
          line = char;
        } else {
          line = next;
        }
      });
      if (line) lines.push(line);
      const capped = lines.slice(0, 3);
      const start = y - ((capped.length - 1) * lineHeight) / 2;
      capped.forEach((part, index) => context.fillText(part, x, start + index * lineHeight));
    }

    computeLayout();
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
